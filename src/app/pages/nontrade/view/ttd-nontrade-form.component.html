<div class="flex flex-col md:flex-row gap-8 w-full">
    <div class="flex flex-col gap-6 w-full">
        <div class="flex flex-col gap-2 w-full">
            <label for="date">Date:</label>
            <p-datepicker 
                [(ngModel)]="date1"
                [showIcon]="true"
                [dateFormat]="dateFormat"
                inputId="date"
                [showOnFocus]="true"
                disabled
            />
        </div>

        <div class="flex flex-col gap-2 w-full">
            <label for="department">Department:</label>
            <p-select
                [options]="departmentOptions"
                [(ngModel)]="selectedDepartment"
                optionLabel="label"
                [showClear]="true"
                placeholder="Pilih Department"></p-select>
        </div>

        <div class="flex flex-col gap-2 w-full">
            <label for="jenispembayaran">Jenis Pembayaran</label>
            <p-select
                [options]="pembayaranOptions"
                [(ngModel)]="selectedPembayaran"
                optionLabel="label"
                [showClear]="true"
                placeholder="Pilih Jenis Pembayaran"></p-select>
        </div>

        <div class="flex flex-col gap-2 w-full mb-5">
            <label for="note">Note:</label>
            <textarea name="alamat" id="alamat" pTextarea rows="4" style="border: 1px solid #e3e3e3; border-radius: 10px;"></textarea>
        </div>
    </div>

    <div class="flex flex-col gap-2 w-full">
        <label for="detailsgr">Details GR:</label>
        <p-table
            #dt1
            [value]="customers1"
            dataKey="id"
            [rows]="10"
            [loading]="loading"
            [rowHover]="true"
            [showGridlines]="true"
            [paginator]="true"
            [globalFilterFields]="['name', 'country.name', 'representative.name', 'status']"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
            [showCurrentPageReport]="true"
            responsiveLayout="scroll"
            [rowsPerPageOptions]="[5, 10, 20]"
        >
            <ng-template #caption>
                <div class="flex justify-between items-center flex-column sm:flex-row">
                    <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash" (click)="clear(dt1)"></button>
                    <p-iconfield iconPosition="left" class="ml-auto">
                        <p-inputicon>
                            <i class="pi pi-search"></i>
                        </p-inputicon>
                        <input pInputText type="text" (input)="onGlobalFilter(dt1, $event)" placeholder="Search keyword" />
                    </p-iconfield>
                </div>
            </ng-template>
            <ng-template #header>
                <tr>
                    <th style="min-width: 13rem; background-color: red; color: white;">
                        <div class="flex justify-between items-center">
                            No GR
                            <p-columnFilter type="text" field="name" display="menu" placeholder="Search by name"></p-columnFilter>
                        </div>
                    </th>
                    <th style="min-width: 13rem; background-color: red; color: white;">
                        <div class="flex justify-between items-center">
                            No PO
                            <p-columnFilter type="text" field="country.name" display="menu" placeholder="Search by country"></p-columnFilter>
                        </div>
                    </th>
                    <th style="min-width: 13rem; background-color: red; color: white;">
                        <div class="flex justify-between items-center">
                            No AP
                            <p-columnFilter field="representative" matchMode="in" display="menu" [showMatchModes]="false" [showOperator]="false" [showAddButton]="false">
                                <ng-template #header>
                                    <div class="px-3 pt-3 pb-0">
                                        <span class="font-bold">Agent Picker</span>
                                    </div>
                                </ng-template>
                                <ng-template #filter let-value let-filter="filterCallback">
                                    <p-multiselect [ngModel]="value" [options]="representatives" placeholder="Any" (onChange)="filter($event.value)" optionLabel="name" styleClass="w-full">
                                        <ng-template let-option #item>
                                            <div class="flex items-center gap-2 w-44">
                                                <img [alt]="option.label" src="https://primefaces.org/cdn/primeng/images/demo/avatar/{{ option.image }}" width="32" />
                                                <span>{{ option.name }}</span>
                                            </div>
                                        </ng-template>
                                    </p-multiselect>
                                </ng-template>
                            </p-columnFilter>
                        </div>
                    </th>
                    <th style="min-width: 13rem; background-color: red; color: white;">
                        <div class="flex justify-between items-center">
                            No PCR
                            <p-columnFilter type="date" field="date" display="menu" placeholder="mm/dd/yyyy"></p-columnFilter>
                        </div>
                    </th>
                </tr>
            </ng-template>
            <ng-template #body let-customer>
                <tr>
                    <td>
                        {{ customer.name }}
                    </td>
                    <td>
                        <div class="flex items-center gap-2">
                            <img src="https://primefaces.org/cdn/primeng/images/demo/flag/flag_placeholder.png" [class]="'flag flag-' + customer.country.code" width="30" />
                            <span>{{ customer.country.name }}</span>
                        </div>
                    </td>
                    <td>
                        <div class="flex items-center gap-2">
                            <img [alt]="customer.representative.name" src="https://primefaces.org/cdn/primeng/images/demo/avatar/{{ customer.representative.image }}" width="32" style="vertical-align: middle" />
                            <span class="image-text">{{ customer.representative.name }}</span>
                        </div>
                    </td>
                    <td>
                        <p-button severity="danger" icon="pi pi-times"></p-button>
                        {{ customer.date | date: 'MM/dd/yyyy' }}
                    </td>
                </tr>
            </ng-template>
            <ng-template #emptymessage>
                <tr>
                    <td colspan="8">No customers found.</td>
                </tr>
            </ng-template>
            <ng-template #loadingbody>
                <tr>
                    <td colspan="8">Loading customers data. Please wait.</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<div class="flex flex-col items-center">
    <button pButton label="Save" severity="info" icon="pi pi-save" (click)="clear(dt1)"></button>
</div>
