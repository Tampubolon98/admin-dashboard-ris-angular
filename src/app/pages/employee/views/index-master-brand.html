<div class="card">
            <div class="font-semibold text-xl mb-4">Master Brand</div>
            <div class="flex justify-between items-center flex-column sm:flex-row">
                <div class="mb-4">
                    <p-button label="Tambah Data" severity="success" class="mr-2" icon="pi pi-plus" (onClick)="openAddDialog()"></p-button>
                </div>
            </div>
            
            <p-table
                #dt1
                [value]="brands"
                dataKey="data.md"
                [rows]="10"
                [loading]="loading"
                [rowHover]="true"
                [showGridlines]="true"
                [paginator]="true"
                [globalFilterFields]="['data.id_brand_emp', 'data.detail_brand', 'data.nama_supplier', 'data.id_brand_emp']"
                responsiveLayout="scroll"
                [showCurrentPageReport]="true"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                [rowsPerPageOptions]="[10, 25, 50]"
            >
                <ng-template #caption>
                    <div class="flex justify-between items-center flex-column sm:flex-row">
                        <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash" (click)="clear(dt1)"></button>
                        <p-iconfield iconPosition="left" class="ml-auto">
                            <p-inputicon>
                                <i class="pi pi-search"></i>
                            </p-inputicon>
                            <input pInputText type="text" (input)="onGlobalFilter(dt1, $event)" placeholder="Search keyword" />
                        </p-iconfield>
                    </div>
                </ng-template>
                <ng-template #header>
                    <tr>
                        <th style="min-width: 12rem; background-color: red; color: white;">
                            <div class="flex justify-between items-center">
                                MD Code
                                <p-columnFilter type="text" field="name" display="menu" placeholder="Search by name"></p-columnFilter>
                            </div>
                        </th>
                        <th style="min-width: 12rem; background-color: red; color: white;">
                            <div class="flex justify-between items-center">
                                Brand
                                <p-columnFilter type="text" field="country.name" display="menu" placeholder="Search by country"></p-columnFilter>
                            </div>
                        </th>
                        <th style="min-width: 14rem; background-color: red; color: white;">
                            <div class="flex justify-between items-center">
                                Supplier Name
                                <p-columnFilter field="representative" matchMode="in" display="menu" [showMatchModes]="false" [showOperator]="false" [showAddButton]="false">
                                    <ng-template #header>
                                        <div class="px-3 pt-3 pb-0">
                                            <span class="font-bold">Agent Picker</span>
                                        </div>
                                    </ng-template>
                                    <ng-template #filter let-value let-filter="filterCallback">
                                        <p-multiselect [ngModel]="value" [options]="representatives" placeholder="Any" (onChange)="filter($event.value)" optionLabel="name" styleClass="w-full">
                                            <ng-template let-option #item>
                                                <div class="flex items-center gap-2 w-44">
                                                    <img [alt]="option.label" src="https://primefaces.org/cdn/primeng/images/demo/avatar/{{ option.image }}" width="32" />
                                                    <span>{{ option.name }}</span>
                                                </div>
                                            </ng-template>
                                        </p-multiselect>
                                    </ng-template>
                                </p-columnFilter>
                            </div>
                        </th>
                        <th style="min-width: 12rem; background-color: red; color: white;">
                            <div class="flex justify-between items-center">
                                Action
                            </div>
                        </th>
                    </tr>
                </ng-template>
                <ng-template #body let-brand>
                    <tr>
                        <td>
                            {{ brand?.md || '-' }}
                        </td>
                        <td>
                            {{ brand?.detail_brand || '-' }}
                        </td>
                        <td>
                            {{ brand?.nama_supplier || '-' }}
                        </td>
                        <td>
                            <p-button label="Edit" severity="success" icon="pi pi-pen-to-square" size="small" (onClick)="openEditDialog(brand)" class="mr-2"></p-button>
                            <p-button label="View" severity="info" icon="pi pi-eye" size="small" (onClick)="openDetailDialog(brand)" class="mr-2"></p-button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template #emptymessage>
                    <tr>
                        <td colspan="8">No customers found.</td>
                    </tr>
                </ng-template>
                <ng-template #loadingbody>
                    <tr>
                        <td colspan="8">Loading customers data. Please wait.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
